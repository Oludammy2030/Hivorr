# EP-01-02: Strict analyzer configuration.
#
# Extends the Flutter recommended lint set (package:flutter_lints/flutter.yaml,
# which inherits package:lints/recommended.yaml) with strict language settings
# and additional maintainability rules approved in EP-01-02 §5.4.
#
# Rules are not enabled indiscriminately: only rules that do not conflict with
# Flutter framework patterns or the approved infrastructure boundaries are
# enabled. Any future exception must be narrow, justified, and local.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    # Strict casts: flag implicit casts.
    strict-casts: true
    # Strict inference: flag implicit dynamic inference.
    strict-inference: true
    # Strict raw types: flag raw generic types without type parameters.
    strict-raw-types: true

linter:
  rules:
    # Explicit return types where appropriate.
    always_declare_return_types: true
    # Directive consistency: keep import/export directives ordered.
    directives_ordering: true
    # Override consistency is already enforced by annotate_overrides, inherited
    # from package:lints/recommended.yaml.
    # Avoidance of unnecessary dynamic calls.
    avoid_dynamic_calls: true
    # Safe handling of asynchronous resources.
    unawaited_futures: true
    discarded_futures: true
    avoid_slow_async_io: true
    # Prohibition of print in production code is already inherited via
    # package:flutter_lints/flutter.yaml (avoid_print).
