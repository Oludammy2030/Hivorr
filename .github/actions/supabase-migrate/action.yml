# Supabase DB Migration — EP-01-05 / EP-02-18 hardening
#
# Composite action: applies versioned `supabase/migrations/*.sql` to a Supabase
# project via `supabase link` + `supabase db push`. Runs in the CALLER's job
# context, so the caller's migrate job MUST:
#   1. declare `environment:` (staging / production), and
#   2. pass the environment-scoped secrets via job-level env:
#        env:
#          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
#          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
#
# This is the ONLY mechanism that works with the project-scoped access tokens
# (verified 2026-09-21): the staging token can only reach cgxkiczmwzydhoroclvf
# and the production token only fxpcgtetvzlexbptqiwp, so no single repo-level
# token can serve both environments. Three alternatives were tried and failed:
#   - relay job outputs: GitHub suppresses outputs containing secret values
#   - `environment:` on a called reusable workflow's job: env secrets do not
#     resolve inside called workflows (run 35576656727)
#   - repo-level shared token: rejected (401) and impossible with project scoping
#
# Fail-closed: an empty token is a hard error, so dependent build/deploy jobs are
# skipped — drift protection can never silently deactivate.
#
# Actions are pinned to immutable commit SHAs (EP-01-04 §12). The Supabase CLI
# is pinned to 2.115.0 to keep remote pushes reproducible.

name: Supabase DB Migration
description: Links a Supabase project and pushes versioned migrations (fail-closed)

inputs:
  environment-name:
    description: Target environment (staging, production) — used in logs and step summary
    required: true
  supabase-url:
    description: Supabase project HTTPS URL (project-ref derivation fallback)
    required: true
  supabase-project-ref:
    description: Supabase project ref. If empty, derived from supabase-url host.
    required: false
    default: ''
  dry-run:
    description: If 'true', only show remote status/diff — do not push.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate migration inputs and derive project ref
      shell: bash
      env:
        INPUT_REF: ${{ inputs.supabase-project-ref }}
        SUPABASE_URL: ${{ inputs.supabase-url }}
      run: |
        set -e
        if [ -z "$SUPABASE_URL" ]; then
          echo "::error::supabase-url is required"
          exit 1
        fi
        if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
          echo "::error::SUPABASE_ACCESS_TOKEN resolved empty in the migrate job — the caller must declare environment: and pass the environment-scoped secret via job-level env. Failing closed so the schema cannot drift from the deployed artifact."
          exit 1
        fi
        if [ -z "$SUPABASE_DB_PASSWORD" ]; then
          echo "::notice::SUPABASE_DB_PASSWORD not set — will try supabase link without --password (access-token pooler)."
        fi
        REF="$INPUT_REF"
        if [ -z "$REF" ]; then
          # Derive from https://<ref>.supabase.co
          REF=$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          echo "Derived project ref from URL host: $REF"
        fi
        if [ ${#REF} -lt 10 ]; then
          echo "::error::Invalid project ref derived: '$REF' from URL '$SUPABASE_URL'"
          exit 1
        fi
        echo "SUPABASE_PROJECT_REF=$REF" >> "$GITHUB_ENV"
        echo "Project ref: $REF (${{ inputs.environment-name }})"
        COUNT=$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l)
        echo "Local migration files: $COUNT"
        ls -1 supabase/migrations/*.sql

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      with:
        version: 2.115.0

    - name: Verify pinned CLI version
      shell: bash
      run: supabase --version

    - name: Link remote project
      shell: bash
      run: |
        set -e
        echo "Linking to project $SUPABASE_PROJECT_REF..."
        if [ -n "$SUPABASE_DB_PASSWORD" ]; then
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        else
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
        fi

    - name: Remote migration status
      shell: bash
      run: |
        set -e
        echo "Checking remote migration status..."
        supabase db diff --linked --schema public 2>&1 | head -100 || true
        echo "--- Remote migration list ---"
        # supabase migration list --linked shows applied vs local
        supabase migration list --linked 2>&1 | tail -30 || true

    - name: Push migrations
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      run: |
        set -e
        echo "Pushing migrations to ${{ inputs.environment-name }} ($SUPABASE_PROJECT_REF)..."
        supabase db push --linked
        echo "Push complete. Verifying remote schema..."
        supabase migration list --linked 2>&1 | tail -30 || true

    - name: Record migration metadata
      if: always()
      shell: bash
      run: |
        echo "## Supabase Migration — ${{ inputs.environment-name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Environment | \`${{ inputs.environment-name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Project ref | \`${SUPABASE_PROJECT_REF:-unset}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Supabase URL | \`${{ inputs.supabase-url }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Dry run | \`${{ inputs.dry-run }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Local migrations | \`$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l)\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Workflow Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
