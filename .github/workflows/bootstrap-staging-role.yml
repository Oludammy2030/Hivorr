name: Bootstrap staging founder role

# Founder-only, staging-only operational workflow. It assigns the seeded
# `founder` role and the control grants to an existing staging account. It is
# idempotent and writes its own audit record. It never targets production.

on:
  workflow_dispatch:
    inputs:
      email:
        description: Existing staging account email
        required: true
        type: string
      confirmation:
        description: Type BOOTSTRAP_STAGING to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: assign founder role on staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Require the founder account and explicit confirmation
        env:
          ACTOR: ${{ github.actor }}
          FOUNDER: ${{ vars.FOUNDER_GITHUB_LOGIN }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ -z "$FOUNDER" ]; then
            echo "FOUNDER_GITHUB_LOGIN is not configured. Refusing bootstrap."
            exit 1
          fi
          if [ "$ACTOR" != "$FOUNDER" ]; then
            echo "Only the founder account may run this workflow. Refusing."
            exit 1
          fi
          if [ "$CONFIRMATION" != "BOOTSTRAP_STAGING" ]; then
            echo "Confirmation phrase did not match. Refusing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm 10.34.9
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.34.9
          run_install: false

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Assign founder role and control grants
        env:
          HIVORR_ENV: staging
          DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
          FOUNDER_EMAIL: ${{ inputs.email }}
        run: node scripts/bootstrap-staging-role.mjs
