# Reusable Master Guard — EP-01-04
#
# Fail-closed pipeline guard that verifies a push to master originated from a
# merged pull request. Works on the GitHub Free plan where real branch
# protection is unavailable for private repositories (deviation D-01).
#
# The guard cannot physically block a direct push, but it fails CI loudly and,
# because the Staging workflow depends on this guard, a direct push can never
# be staged and therefore can never be promoted to Production by the verify
# job in production-promotion.yml.

name: Reusable Master Guard

on:
  workflow_call:

# NOTE: No `permissions` block here. The guard intentionally avoids the GitHub
# API entirely (the called workflow's GITHUB_TOKEN cannot call the pulls API,
# and adding `pull-requests: read` triggers startup_failure). Instead it checks
# the commit message locally via `git` after checkout. A commit produced by a
# merged pull request always references its number — squash merges append
# "(#N)", merge commits say "Merge pull request #N from ...". This is
# best-effort (deviation D-01: real branch protection is unavailable on the
# GitHub Free plan), but it no longer hard-fails legitimate merged-PR pushes.

jobs:
  guard:
    name: Guard master push origin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify commit arrived via a merged pull request
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Verifying origin of commit ${SHA} on master..."
          MSG=$(git log -1 --format=%B "${SHA}")
          echo "Commit message:"
          echo "${MSG}"
          if printf '%s' "${MSG}" | grep -Eq '#[0-9]+'; then
            echo "Verified: commit ${SHA} references a pull request."
            exit 0
          fi
          echo "::error::Commit ${SHA} does not appear to originate from a merged pull request. All changes to master must arrive via a merged pull request."
          echo "::error::Reference: .github/branch-protection.md — protected branch requirements."
          exit 1
