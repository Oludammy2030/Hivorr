# Temporary diagnostic (delete after use) — determines which SUPABASE_ACCESS_TOKEN
# values are valid WITHOUT printing any secret material: each job calls the
# Supabase management API and reports only the HTTP status code and project count.
#
# Evidence so far (2026-09-21):
#   - repo-level secret -> 401 Unauthorized at `supabase link` (run 35578728039)
#   - local workstation env token -> 401 Unauthorized
#   - environment-scoped secrets (staging/production) -> never exercised

name: Supabase Token Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/token-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.scope }} token
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: repo-level
            environment: ""
          - scope: staging-env
            environment: staging
          - scope: production-env
            environment: production
    steps:
      - name: Probe token against management API
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::[${{ matrix.scope }}] token is EMPTY (secret not set / not resolvable in this context)"
            exit 0
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects)
          echo "[${{ matrix.scope }}] management API -> HTTP $code"
          if [ "$code" = "200" ]; then
            count=$(jq length /tmp/out.json)
            echo "[${{ matrix.scope }}] token is VALID — can list $count project(s)"
          else
            echo "[${{ matrix.scope }}] token is REJECTED — response body (no secret material):"
            head -c 300 /tmp/out.json; echo
          fi
