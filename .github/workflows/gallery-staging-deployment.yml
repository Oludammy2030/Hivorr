# Design System Gallery — Staging Deployment
#
# Builds the standalone design-system gallery (lib/gallery/main.dart) and
# deploys it to a dedicated Cloudflare Pages project so the UI/UX primitives
# can be reviewed live. Triggered on push to master alongside the app staging
# pipeline.
#
# Reuses the same Cloudflare credentials as the app staging deployment:
#   Variables (staging environment):
#     CLOUDFLARE_ACCOUNT_ID
#     CLOUDFLARE_PAGES_GALLERY_PROJECT_NAME
#   Secrets (staging environment):
#     CLOUDFLARE_API_TOKEN
#
# If CLOUDFLARE_PAGES_GALLERY_PROJECT_NAME is not set, deployment is skipped
# with a warning (non-blocking).

name: Design System Gallery (Staging)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: gallery-staging
  cancel-in-progress: true

jobs:
  deploy-gallery:
    name: Build & Deploy Gallery
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build gallery web
        run: flutter build web --release -t lib/gallery/main.dart

      - name: Check deployment target
        id: deploy-check
        shell: bash
        run: |
          if [ -n "${{ vars.CLOUDFLARE_PAGES_GALLERY_PROJECT_NAME }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CLOUDFLARE_PAGES_GALLERY_PROJECT_NAME configured in the staging environment. Gallery deployment skipped."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.deploy-check.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler pages deploy build/web \
            --project-name="${{ vars.CLOUDFLARE_PAGES_GALLERY_PROJECT_NAME }}" \
            --branch="${{ github.ref_name }}" \
            --commit-hash="${{ github.sha }}" \
            --commit-message="Gallery staging deployment ${{ github.sha }}"
