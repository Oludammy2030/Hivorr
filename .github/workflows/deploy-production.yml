name: Production deployment

on:
  workflow_dispatch:
    inputs:
      approval_reference:
        description: Written founder approval reference (issue, record or message ID)
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION to confirm the manual release
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  founder-approval:
    name: verify founder approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the founder account and an approval reference
        run: |
          if [ -z "${{ vars.FOUNDER_GITHUB_LOGIN }}" ]; then
            echo "FOUNDER_GITHUB_LOGIN is not configured. Refusing production deployment."
            exit 1
          fi
          if [ "${{ github.actor }}" != "${{ vars.FOUNDER_GITHUB_LOGIN }}" ]; then
            echo "Only the founder account may dispatch a production deployment."
            echo "Actor: ${{ github.actor }}; required: ${{ vars.FOUNDER_GITHUB_LOGIN }}"
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "DEPLOY_PRODUCTION" ]; then
            echo "Confirmation phrase did not match. Refusing production deployment."
            exit 1
          fi
          if [ -z "${{ inputs.approval_reference }}" ]; then
            echo "An explicit approval reference is required. Refusing production deployment."
            exit 1
          fi
          echo "Founder approval reference: ${{ inputs.approval_reference }}"

  verify-pr:
    name: verify production PR
    needs: founder-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require a merged pull request into main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: main
        run: node scripts/verify-pr-merge.mjs

  build-production-artifact:
    name: build production artifact
    needs: verify-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm 10.34.9
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.34.9
          run_install: false

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:all

      - name: Record production artifact
        run: |
          echo "Production artifact built from ${{ github.sha }}"
          echo "Founder approval reference: ${{ inputs.approval_reference }}"
          echo "No production host is configured in this phase; deployment remains an explicit later step."
