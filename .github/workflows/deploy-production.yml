name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Staging-verified commit SHA to promote (40 hex characters)
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION to confirm the manual release
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify-founder-approval:
    name: verify founder approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require the founder account, confirmation, and a release SHA
        env:
          FOUNDER_LOGIN: ${{ vars.FOUNDER_GITHUB_LOGIN }}
          ACTOR: ${{ github.actor }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ -z "$FOUNDER_LOGIN" ]; then
            echo "FOUNDER_GITHUB_LOGIN is not configured. Refusing production deployment."
            exit 1
          fi
          if [ "$ACTOR" != "$FOUNDER_LOGIN" ]; then
            echo "Only the founder account may dispatch a production deployment."
            echo "Actor: $ACTOR; required: $FOUNDER_LOGIN"
            exit 1
          fi
          if [ "$CONFIRMATION" != "DEPLOY_PRODUCTION" ]; then
            echo "Confirmation phrase did not match. Refusing production deployment."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_sha must be a 40-character lowercase hex commit SHA."
            exit 1
          fi
          echo "Release SHA: $RELEASE_SHA"

      - name: Verify the release-candidate issue and founder command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          FOUNDER_GITHUB_LOGIN: ${{ vars.FOUNDER_GITHUB_LOGIN }}
        run: node scripts/verify-founder-approval.mjs

  verify-release-ancestry:
    name: verify release belongs to main
    needs: verify-founder-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Require the release SHA to be part of main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null; then
            echo "Release SHA $RELEASE_SHA is not present in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release SHA $RELEASE_SHA is not an ancestor of main. Promote only a merged release."
            exit 1
          fi
          echo "Release $RELEASE_SHA is part of main."

  promote-release:
    name: download and verify staging artifact
    needs: verify-release-ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Resolve the successful staging run
        id: staging-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --workflow deploy-staging.yml \
            --commit "$RELEASE_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful staging deployment gate exists for $RELEASE_SHA. Refusing promotion."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Promoting the artifact from staging run $run_id."

      - name: Download the staging application artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.staging-run.outputs.run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p downloaded/dist downloaded/manifest
          gh run download "$RUN_ID" --name "staging-build-$RELEASE_SHA" --dir downloaded/dist
          gh run download "$RUN_ID" --name "release-manifest-$RELEASE_SHA" --dir downloaded/manifest

      - name: Verify the downloaded artifact against the staging manifest
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: >-
          node scripts/verify-release-manifest.mjs
          --manifest downloaded/manifest/release-manifest.json
          --sha "$RELEASE_SHA"
          --ref staging
          --dist downloaded/dist
          --server server/src
          --migrations supabase/migrations

      - name: Verify the production backend target
        if: vars.PRODUCTION_DEPLOY_TARGET != ''
        env:
          HIVORR_ENV: production
          BACKEND_ENVIRONMENT: production
          SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "PRODUCTION_SUPABASE_PROJECT_REF is not configured. Refusing production deployment."
            exit 1
          fi
          node scripts/verify-backend-target.mjs

      - name: Record the verified promotion
        run: |
          echo "Production promotion verified from the staging artifact, with no rebuild."
          echo "Release SHA: ${{ inputs.release_sha }}"
          echo "Staging run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.staging-run.outputs.run_id }}"
          if [ -n "${{ vars.PRODUCTION_DEPLOY_TARGET }}" ]; then
            echo "Production deployment target: ${{ vars.PRODUCTION_DEPLOY_TARGET }}"
          else
            echo "No production host is configured yet; the verified artifact is ready for the rollout stage."
          fi
