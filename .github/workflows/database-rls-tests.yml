# Database RLS & RPC Tests — EP-01-05
#
# Additive workflow file. Existing EP-01-04 workflows are NOT modified.
#
# Runs the pgTAP enforcement suite (RLS leakage matrix, RPC auth
# enforcement, validation/error contract, security posture audit) against a
# clean local Supabase instance rebuilt from the versioned migrations.
# No environment credentials are used (EP-01-05 Plan §15).
#
# Actions are pinned to immutable commit SHAs for supply-chain security
# (matching EP-01-04 §12 convention).

name: Database RLS & RPC Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    name: RLS & RPC Enforcement Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Verify pinned CLI version
        run: supabase --version

      - name: Pre-pull Supabase images from public.ecr.aws to bypass GHCR rate-limit
        shell: bash
        run: |
          set -e
          echo "Pre-pulling Supabase images from public.ecr.aws (bypass ghcr.io 44000/minute)..."
          # supabase start pulls from ghcr.io by default; pre-pull from public.ecr.aws
          # and tag as ghcr.io so supabase start reuses cached layers.
          # Also pre-pull pg_prove for supabase test db.
          for img in postgres:15.8.1.085 postgres-meta:v0.98.0 postgrest:v16.1 storage-api:v1.69.11 gotrue:v2.195.0 realtime:v2.129.0 edge-runtime:v1.74.3 studio:2026.08.17-sha-0c1da8f kong:2.8.1 inbucket:v0.0.0 supavisor:2.4.14 imgproxy:v0.14.0 vector:0.53.0-alpine logflare:1.50.2 pg_prove:3.36; do
            echo "Pulling public.ecr.aws/supabase/$img..."
            if docker pull public.ecr.aws/supabase/$img; then
              docker tag public.ecr.aws/supabase/$img ghcr.io/supabase/$img || true
              docker tag public.ecr.aws/supabase/$img supabase/$img || true
            else
              echo "Warning: failed to pull public.ecr.aws/supabase/$img, will retry via ghcr.io on supabase start"
              # Fallback: try ghcr.io directly with retry
              for r in 1 2 3; do
                if docker pull ghcr.io/supabase/$img; then
                  docker tag ghcr.io/supabase/$img public.ecr.aws/supabase/$img || true
                  break
                fi
                echo "ghcr.io pull failed for $img, retry $r/3 in $((r*5))s..."
                sleep $((r*5))
              done || true
            fi
          done
          echo "Pre-pull complete, cached images:"
          docker images | grep -E "supabase|postgres|pg_prove" || true

      - name: Start local Supabase instance
        shell: bash
        run: |
          set -e
          # GHCR rate-limit (toomanyrequests: 44000/minute) is transient on
          # ubuntu-24.04 runners pulling supabase/* via ghcr.io mirror.
          # Retry with backoff; supabase start is idempotent and reuses pulled images.
          for i in 1 2 3 4 5 6 7 8; do
            echo "Attempt $i/8: supabase start (registry=$SUPABASE_INTERNAL_IMAGE_REGISTRY)..."
            if supabase start; then
              echo "supabase start succeeded on attempt $i"
              break
            fi
            RC=$?
            if [ "$i" -eq 8 ]; then
              echo "::error::supabase start failed after 8 attempts (GHCR toomanyrequests)"
              exit $RC
            fi
            SLEEP=$((i * 30))
            echo "supabase start failed (GHCR toomanyrequests), retrying in ${SLEEP}s..."
            supabase stop --no-backup || true
            docker system prune -f || true
            sleep $SLEEP
          done

      - name: Rebuild clean database from migrations
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            echo "Attempt $i/3: supabase db reset..."
            if supabase db reset; then
              echo "supabase db reset succeeded on attempt $i"
              break
            fi
            RC=$?
            if [ "$i" -eq 3 ]; then
              echo "::error::supabase db reset failed after 3 attempts"
              exit $RC
            fi
            SLEEP=$((i * 10))
            echo "supabase db reset failed, retrying in ${SLEEP}s..."
            sleep $SLEEP
          done

      - name: Run pgTAP enforcement suite
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            echo "Attempt $i/3: supabase test db..."
            if supabase test db; then
              echo "supabase test db succeeded on attempt $i"
              break
            fi
            RC=$?
            if [ "$i" -eq 3 ]; then
              echo "::error::supabase test db failed after 3 attempts"
              exit $RC
            fi
            SLEEP=$((i * 10))
            echo "supabase test db failed (likely GHCR pg_prove pull), retrying in ${SLEEP}s..."
            sleep $SLEEP
          done

      - name: Migration secret scan
        shell: bash
        run: |
          set -e
          echo "Scanning migration sources for secrets..."
          FOUND=0

          # JWT-shaped service-role / anon key material
          if grep -rn --include="*.sql" -E "eyJhbGciOiJIUzI1NiIs" supabase/migrations > /dev/null; then
            echo "::error::JWT credential material detected in supabase/migrations"
            FOUND=1
          fi

          # 'service_role' role identifiers are expected in grants/revokes,
          # but 'service_role' *keys* (the secret suffix pattern) are not.
          if grep -rn --include="*.sql" -E "service_role.*(SERVICE|_ROLE|eyJ)" supabase/migrations > /dev/null; then
            echo "::error::service_role secret pattern detected in supabase/migrations"
            FOUND=1
          fi

          # Live project URLs / passwords in committed config
          if grep -rn -E "(db\.|project-ref|ref_)?" supabase/config.toml | grep -E "\.[a-z0-9-]+\.supabase\.(co|in)" > /dev/null; then
            echo "::error::live Supabase URL detected in supabase/config.toml"
            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi

          echo "No secrets detected."