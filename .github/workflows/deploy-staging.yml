name: Staging deployment gate

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-pr:
    name: verify staging PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require a merged pull request into staging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-pr-merge.mjs

  build-staging-artifact:
    name: build staging release artifact
    needs: verify-pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm 10.34.9
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.34.9
          run_install: false

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build all four application bundles
        run: pnpm build:all

      - name: Generate the release manifest
        run: >-
          node scripts/release-manifest.mjs
          --sha "${{ github.sha }}"
          --ref staging
          --output release-manifest.json

      - name: Verify the release manifest against the build
        run: >-
          node scripts/verify-release-manifest.mjs
          --manifest release-manifest.json
          --sha "${{ github.sha }}"
          --ref staging
          --dist dist

      - name: Record the release digest
        run: |
          set -euo pipefail
          digest="sha256:$(sha256sum release-manifest.json | cut -d' ' -f1)"
          printf '%s\n' "$digest" > release-digest.txt
          echo "release digest: $digest"

      - name: Upload staging application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 90

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload release digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digest-${{ github.sha }}
          path: release-digest.txt
          if-no-files-found: error
          retention-days: 90

      - name: Verify the staging backend target
        if: vars.STAGING_DEPLOY_TARGET != ''
        env:
          HIVORR_ENV: staging
          BACKEND_ENVIRONMENT: staging
          SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "STAGING_SUPABASE_PROJECT_REF is not configured. Refusing staging deployment."
            exit 1
          fi
          node scripts/verify-backend-target.mjs

      - name: Deployment target
        run: |
          if [ -n "${{ vars.STAGING_DEPLOY_TARGET }}" ]; then
            echo "Staging deployment target is configured: ${{ vars.STAGING_DEPLOY_TARGET }}"
            echo "The release is CI-verified and manifest-recorded; hosting rollout is the next stage."
          else
            echo "No staging host is configured yet. The approved PR gate, build, manifest and artifact are in place;"
            echo "the hosting target is an EP-01 entry condition."
          fi

  release-request:
    name: create release request
    needs: build-staging-artifact
    if: vars.STAGING_DEPLOY_TARGET != '' && vars.FOUNDER_GITHUB_LOGIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download the release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ github.sha }}

      - name: Create the release-candidate issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          MANIFEST_PATH: release-manifest.json
          STAGING_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="release-candidate"
          gh label create "$label" \
            --color FBCA04 \
            --description "Staging-verified release awaiting founder approval" \
            --force || true
          existing="$(gh issue list \
            --label "$label" \
            --state all \
            --search "$RELEASE_SHA" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Release issue #$existing already exists for $RELEASE_SHA; not creating a duplicate."
            exit 0
          fi
          node scripts/release-issue-body.mjs > release-issue.md
          gh issue create \
            --title "Release ${RELEASE_SHA:0:7}" \
            --label "$label" \
            --body-file release-issue.md

  deploy-pages:
    name: deploy staging portals to Pages
    needs: build-staging-artifact
    if: vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.hivorr.com
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install wrangler 4.160.0
        run: npm install --global wrangler@4.160.0

      - name: Download the verified staging build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-build-${{ github.sha }}
          path: dist

      - name: Download the release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ github.sha }}

      - name: Verify the downloaded build against the manifest
        run: >-
          node scripts/verify-release-manifest.mjs
          --manifest release-manifest.json
          --sha "${{ github.sha }}"
          --ref staging
          --dist dist

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set in the staging environment."
            echo "Add it as an environment secret, or unset the CLOUDFLARE_PAGES_ENABLED variable to skip the Pages rollout."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set as a repository variable."
            exit 1
          fi

      - name: Deploy the four staging bundles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deploy() {
            local attempt=1
            echo "pages: deploying $1 to $2 for ${GITHUB_SHA:0:7}"
            until wrangler pages deploy "$1" \
              --project-name "$2" \
              --branch staging \
              --commit-hash "$GITHUB_SHA"; do
              if [ "$attempt" -ge 3 ]; then
                echo "pages: $2 failed after $attempt attempts"
                return 1
              fi
              attempt=$((attempt + 1))
              echo "pages: $2 failed, retrying in 20s (attempt $attempt of 3)"
              sleep 20
            done
          }
          deploy dist hivorr-staging-main
          deploy dist/portals/control hivorr-staging-control
          deploy dist/portals/staff hivorr-staging-staff
          deploy dist/portals/partner hivorr-staging-partner

      - name: Smoke test the public portal
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://staging.hivorr.com/)"
          echo "main portal responded with $status"
          if [ "$status" != "200" ]; then
            echo "The main portal did not serve the release."
            exit 1
          fi
