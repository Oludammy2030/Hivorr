name: Provision Super Admin (one-off)

on:
  workflow_dispatch:
    inputs:
      email:
        description: User email to grant super admin
        required: true
        default: oludammy2030@gmail.com

permissions:
  contents: read

jobs:
  provision:
    name: Provision Super Admin
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Verify CLI
        run: supabase --version

      - name: Link to production
        run: supabase link --project-ref fxpcgtetvzlexbptqiwp

      - name: Check user and existing admin
        run: |
          set -e
          echo "Looking up user ${{ inputs.email }}..."
          supabase db query --linked "select id, email, created_at from auth.users where email = '${{ inputs.email }}';"
          echo "--- existing platform_admins row ---"
          supabase db query --linked "select user_id, is_active, granted_at, revoked_at from public.platform_admins where user_id = (select id from auth.users where email = '${{ inputs.email }}');" || true
          echo "--- is_platform_admin before ---"
          supabase db query --linked "select public.is_platform_admin((select id from auth.users where email = '${{ inputs.email }}')) as is_admin_before;"

      - name: Provision super admin
        run: |
          set -e
          echo "Provisioning ${{ inputs.email }}..."
          supabase db query --linked "insert into public.platform_admins (user_id, granted_by, notes) select id, null, 'Bootstrap super admin via ops workflow' from auth.users where email = '${{ inputs.email }}' on conflict (user_id) do update set is_active = true, granted_at = now(), revoked_at = null, updated_at = now() returning user_id, is_active, granted_at;"
          echo "--- verify is_platform_admin after ---"
          supabase db query --linked "select public.is_platform_admin((select id from auth.users where email = '${{ inputs.email }}')) as is_admin_after;"
          echo "--- platform_admins row after ---"
          supabase db query --linked "select user_id, is_active, granted_at from public.platform_admins where user_id = (select id from auth.users where email = '${{ inputs.email }}');"
