app = "hivorr-staging-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  HIVORR_ENV = "staging"
  BACKEND_ENVIRONMENT = "staging"
  SUPABASE_PROJECT_REF = "hkswhaltyqfqkgswukfs"
  SESSION_ISSUER = "hivorr-staging"
  API_PORT = "3000"
  API_HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  TRUST_PROXY = "true"
  PUBLIC_APP_ORIGIN = "https://staging.hivorr.com"
  MAIL_FROM_ADDRESS = "no-reply@mail.hivorr.com"
  MAIL_FROM_NAME = "Hivorr"
  ZEPTOMAIL_API_URL = "https://cpaas.zoho.com/v1.1/email"
  STAFF_EMAIL_DOMAIN = "hivorr.com"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine that sleeps when idle and wakes on the first request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/v1/health/live"
    timeout = "5s"
