# Supabase local development configuration — EP-01-05
#
# This file configures the LOCAL Supabase instance used by developers and by
# the database RLS test workflow. It contains no secrets: project credentials
# (access token, database passwords, service-role keys) are supplied through
# environment variables / secret stores only (EP-01-05 Plan §5.1, §5.2).

project_id = "hivorr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
major_version = 15

[db.extensions]
pgcrypto = { schema = "extensions" }
pgtap = { schema = "extensions" }

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Password-recovery PKCE deep links terminate on the web client landing page
# (served by run_local.ps1 at localhost:8080), not the CLI site_url. GoTrue
# only honours redirects whose origin is allow-listed here.
additional_redirect_urls = [
  "http://localhost:8080/reset-password",
  "http://127.0.0.1:8080/reset-password",
]
# Password policy mirrors the hosted project's Auth settings (strongest preset):
# minimum 8 characters and required lowercase, uppercase, digit, and symbol.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Password-recovery email. Unlike the confirmation/magic-link templates, the
# recovery link is a deep link (PKCE): the client exchanges the `code` on the
# web landing page at /reset-password — recovery has no OTP entry screen.
# Keep `additional_redirect_urls` below in sync with the landing page origin.
[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true

[storage.buckets.credential-documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "application/pdf"]

[storage.buckets.profile-avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.portfolio-items]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "application/pdf"]