<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Hivorr">
  <title>Hivorr</title>
  <!-- Monochrome, single-color lockup (no tile). Recolor at runtime via the
       LogoMonochrome widget's `color` (default white) for dark headers/footers. -->
  <g transform="translate(8,16) scale(0.1875)" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="128" y1="128" x2="128" y2="62"/>
    <line x1="128" y1="128" x2="66" y2="180"/>
    <line x1="128" y1="128" x2="190" y2="180"/>
  </g>
  <g transform="translate(8,16) scale(0.1875)" fill="#FFFFFF">
    <circle cx="128" cy="62" r="17"/>
    <circle cx="66" cy="180" r="17"/>
    <circle cx="190" cy="180" r="17"/>
    <circle cx="128" cy="128" r="24"/>
  </g>
  <text x="70" y="53" font-family="Inter, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">Hivorr</text>
</svg>
